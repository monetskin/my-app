<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0F1115" />
<title>짬뽕의 AI 영어회화</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#0F1115; --surface:#1A1D24; --chip:#252932; --border:#2A2F3A; --text:#F4F1EE; --sub:#A8AEB8; --accent:#FF8A65; --accent-soft:rgba(255,138,101,.18); --accent-hover:#FFB199; --card-shadow:0 8px 32px rgba(0,0,0,.35); }
  [data-theme="light"] { --bg:#FFF8F4; --surface:#FFFFFF; --chip:#F4E9DF; --border:#EADBC9; --text:#1E1A18; --sub:#776B62; --accent:#FF8A65; --accent-soft:rgba(255,138,101,.14); --accent-hover:#E56B45; --card-shadow:0 8px 30px rgba(180,90,30,.10); }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:"Pretendard","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; letter-spacing:-.01em; transition:background-color .25s ease,color .25s ease; }
  .en { font-family:"Inter","Pretendard",sans-serif; }
  .app { max-width:720px; margin:0 auto; padding:24px 18px 36px; min-height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:22px; }
  .title-block { flex:1; }
  .title { font-family:"Inter",sans-serif; font-weight:800; font-size:22px; letter-spacing:-.02em; line-height:1.15; color:var(--text); }
  .subtitle { margin-top:6px; font-size:12.5px; color:var(--sub); line-height:1.4; font-weight:500; }
  .icon-btn { background:var(--chip); border:1px solid var(--border); color:var(--text); width:38px; height:38px; border-radius:11px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .12s ease,background .15s ease; -webkit-tap-highlight-color:transparent; }
  .icon-btn:hover { transform:translateY(-1px); }
  .icon-btn:active { transform:translateY(0); }
  .icon-btn svg { width:18px; height:18px; }
  .header-actions { display:flex; gap:8px; }
  .dots { display:flex; gap:6px; justify-content:center; margin-bottom:20px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--chip); border:1px solid var(--border); transition:background .2s ease,transform .2s ease,border-color .2s ease; }
  .dot.filled { background:var(--accent); border-color:var(--accent); transform:scale(1.15); }
  .dot.current { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .card-wrap { perspective:1200px; margin:8px auto 16px; width:100%; max-width:520px; }
  .card { position:relative; width:100%; min-height:280px; border-radius:22px; background:var(--surface); box-shadow:var(--card-shadow); border:1px solid var(--border); transform-style:preserve-3d; transition:transform .55s cubic-bezier(.2,.8,.2,1); cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .card.flipped { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; padding:28px 24px 22px; display:flex; flex-direction:column; justify-content:space-between; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .face.back { transform:rotateY(180deg); }
  .badge-row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .badge { font-size:11.5px; color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent); padding:4px 10px; border-radius:999px; font-weight:600; letter-spacing:.02em; }
  .flip-hint { font-size:11px; color:var(--sub); font-weight:500; }
  .speak-btn { width:30px; height:30px; border-radius:999px; background:var(--chip); border:1px solid var(--border); color:var(--text); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; line-height:1; flex-shrink:0; -webkit-tap-highlight-color:transparent; transition:border-color .15s ease,background .15s ease; }
  .speak-btn:hover { border-color:var(--accent); background:var(--accent-soft); }
  .speak-btn:active { transform:scale(.94); }
  .text { font-size:22px; line-height:1.55; font-weight:500; color:var(--text); word-break:keep-all; overflow-wrap:anywhere; flex:1; display:flex; align-items:center; justify-content:center; text-align:center; padding:14px 4px; }
  .text.en { font-family:"Inter",sans-serif; font-weight:500; letter-spacing:-.005em; }
  .keyword-row { border-top:1px dashed var(--border); padding-top:12px; font-size:12.5px; color:var(--sub); display:flex; justify-content:space-between; gap:8px; }
  .keyword-row .pos { color:var(--sub); }
  .keyword-row .num { color:var(--accent); font-weight:600; }
  .nav { display:flex; gap:10px; justify-content:center; margin-top:8px; }
  .btn { background:var(--surface); color:var(--text); border:1px solid var(--border); padding:13px 22px; border-radius:14px; font-size:14px; font-weight:600; cursor:pointer; transition:background .15s ease,border-color .15s ease,transform .12s ease; min-width:100px; -webkit-tap-highlight-color:transparent; letter-spacing:-.005em; }
  .btn:hover { border-color:var(--accent); }
  .btn:active { transform:scale(.97); }
  .btn.primary { background:var(--accent); color:#1A0805; border-color:var(--accent); }
  .btn.primary:hover { background:var(--accent-hover); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .complete { background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:28px 22px; margin:8px auto 16px; width:100%; max-width:520px; text-align:center; }
  .complete .emoji { font-size:40px; line-height:1; margin-bottom:8px; }
  .complete h2 { margin:0 0 6px; font-family:"Inter",sans-serif; font-size:22px; font-weight:700; }
  .complete p { margin:0 0 18px; color:var(--sub); font-size:13.5px; line-height:1.5; }
  .recap { text-align:left; margin-top:16px; border-top:1px solid var(--border); padding-top:16px; }
  .recap-item { padding:10px 0; border-bottom:1px dashed var(--border); font-size:13.5px; line-height:1.55; }
  .recap-item:last-child { border-bottom:none; }
  .recap-item .k { display:block; color:var(--text); }
  .recap-item .e { display:block; color:var(--sub); font-family:"Inter",sans-serif; margin-top:2px; }
  .recap-item .badge { margin-bottom:6px; display:inline-block; }
  .toast { position:fixed; left:50%; bottom:30px; transform:translate(-50%,30px); background:var(--surface); border:1px solid var(--border); color:var(--text); padding:11px 18px; border-radius:12px; font-size:13px; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,.2); opacity:0; transition:opacity .2s ease,transform .25s ease; pointer-events:none; z-index:50; }
  .toast.show { opacity:1; transform:translate(-50%,0); }
  .meta { margin-top:24px; color:var(--sub); font-size:12px; text-align:center; line-height:1.5; }
  .meta strong { color:var(--text); font-weight:600; }
  @media (max-width:480px) { .app { padding:18px 14px 30px; } .title { font-size:20px; } .text { font-size:19px; } .card { min-height:260px; } .face { padding:22px 18px 18px; } .btn { padding:12px 18px; min-width:86px; font-size:13.5px; } }
  @media (max-width:360px) { .text { font-size:17px; } .subtitle { font-size:11.5px; } }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-block">
        <div class="title">짬뽕의 AI 영어회화</div>
        <div class="subtitle" id="subtitle">⚡ 문장 풀 1,650개 · 오늘의 7문장</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="themeBtn" title="테마 전환 (D)" aria-label="테마 전환">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </button>
        <button class="icon-btn" id="reshuffleBtn" title="다시 뽑기 (R)" aria-label="다시 뽑기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
        </button>
      </div>
    </header>
    <div class="dots" id="dots" aria-label="진행도"></div>
    <main id="main"></main>
    <div class="meta" id="meta">오늘의 7문장은 날짜별로 고정돼 복습돼요 · 🔊 영어 표현을 들어보세요<br>단축키: <strong>D</strong> 테마 · <strong>R</strong> 다시 뽑기 · <strong>← →</strong> 이동 · <strong>Space</strong> 뒤집기</div>
  </div>
  <div class="toast" id="toast"></div>

<script src="sentences.js"></script>
<script>
let currentSessionSentences = [];
let currentIndex = 0;
let isDark = true;

const SESSION_KEY = 'jjamppong_session_v1';
const THEME_KEY = 'jjamppong_theme_v1';

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// 유틸: 배열 섞기
function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// XSS 방지용 이스케이프
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// 1. 세션 저장 (localStorage)
function saveSession() {
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify({ date: todayStr(), sentences: currentSessionSentences }));
  } catch (e) { /* 저장 실패는 무시 */ }
}

// 2. 오늘의 7문장 복원 or 새로 뽑기
function loadNewSession(silent) {
  let restored = null;
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (raw) {
      const obj = JSON.parse(raw);
      if (obj && obj.date === todayStr() && Array.isArray(obj.sentences) && obj.sentences.length > 0) {
        restored = obj.sentences;
      }
    }
  } catch (e) { restored = null; }

  if (restored) {
    currentSessionSentences = restored;
  } else {
    currentSessionSentences = shuffleArray(SEED_POOL).slice(0, 7);
    saveSession();
  }
  currentIndex = 0;
  renderQuiz();
  if (!silent) showToast(restored ? '오늘의 7문장을 이어서 복습할게!' : '새로운 7문장을 뽑았어!');
}

// 3. 기존 세션 그대로 다시 학습하기
function retryCurrentSession() {
  if (!currentSessionSentences || currentSessionSentences.length === 0) {
    loadNewSession();
    return;
  }
  currentIndex = 0;
  renderQuiz();
  showToast('아까 그 7문장으로 다시 복습 시작!');
}

// 토스트 메시지
let _toastTimer = null;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

// 발음 듣기 (SpeechSynthesis)
function speak(text) {
  if (!('speechSynthesis' in window)) {
    showToast('이 기기에서 음성 재생이 지원되지 않아요.');
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[()]/g, (m) => (m === '(' ? '' : '')));
  u.lang = 'en-US';
  u.rate = 0.92;
  speechSynthesis.speak(u);
}

// 화면 렌더링
function renderQuiz() {
  const main = document.getElementById('main');
  const dots = document.getElementById('dots');

  dots.innerHTML = '';
  currentSessionSentences.forEach((_, idx) => {
    const dot = document.createElement('div');
    dot.className = 'dot';
    if (idx < currentIndex) dot.classList.add('filled');
    if (idx === currentIndex) dot.classList.add('current');
    dots.appendChild(dot);
  });

  if (currentIndex >= currentSessionSentences.length) {
    main.innerHTML = `
      <div class="complete">
        <div class="emoji">🎉</div>
        <h2>학습 완료!</h2>
        <p>오늘의 7문장을 모두 끝냈어. 수고했어!</p>
        <button class="btn primary" id="retryBtn" style="width:100%;">다시 학습하기</button>
        <div class="recap">
          <div style="font-weight:600; margin-bottom:10px; font-size:14px;">오늘 공부한 문장 복습</div>
          ${currentSessionSentences.map(item => `
            <div class="recap-item">
              <span class="badge">${esc(item.s)}</span>
              <span class="k">${esc(item.k)}</span>
              <span class="e">${esc(item.e)}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    document.getElementById('retryBtn').addEventListener('click', retryCurrentSession);
    return;
  }

  const item = currentSessionSentences[currentIndex];

  main.innerHTML = `
    <div class="card-wrap">
      <div class="card" id="card" role="button" tabindex="0" aria-label="플립 카드: 한국어 뜻 보기 / 영어 표현 확인">
        <div class="face front">
          <div class="badge-row">
            <span class="badge">${esc(item.s)}</span>
            <span class="flip-hint">카드를 눌러 확인</span>
          </div>
          <div class="text">${esc(item.k)}</div>
          <div class="keyword-row">
            <span class="pos">뜻 보기</span>
            <span class="num">${currentIndex + 1} / ${currentSessionSentences.length}</span>
          </div>
        </div>
        <div class="face back">
          <div class="badge-row">
            <span class="badge">Answer</span>
            <span style="display:flex; align-items:center; gap:8px;">
              <button class="speak-btn" id="speakBtn" title="영어 발음 듣기" aria-label="영어 발음 듣기">🔊</button>
              <span class="flip-hint">카드를 눌러 숨기기</span>
            </span>
          </div>
          <div class="text en">${esc(item.e)}</div>
          <div class="keyword-row">
            <span class="pos">영어 표현</span>
            <span class="num">${currentIndex + 1} / ${currentSessionSentences.length}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="nav">
      <button class="btn" id="prevBtn" ${currentIndex === 0 ? 'disabled' : ''}>이전</button>
      <button class="btn primary" id="nextBtn">${currentIndex === currentSessionSentences.length - 1 ? '완료' : '다음'}</button>
    </div>
  `;

  const card = document.getElementById('card');
  const flip = () => card.classList.toggle('flipped');
  card.addEventListener('click', (e) => {
    if (e.target.closest('#speakBtn')) return;
    flip();
  });
  card.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
  });

  document.getElementById('speakBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    speak(item.e);
  });

  document.getElementById('prevBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    if (currentIndex > 0) { currentIndex--; renderQuiz(); }
  });
  document.getElementById('nextBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    currentIndex++;
    renderQuiz();
  });
}

// 테마 토글
function applyTheme() {
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  updateThemeIcon();
}
function toggleTheme() {
  isDark = !isDark;
  localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
  applyTheme();
}
function updateThemeIcon() {
  const icon = document.getElementById('themeIcon');
  if (isDark) {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
  } else {
    icon.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
  }
}

// 키보드 단축키
document.addEventListener('keydown', (e) => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (e.key === 'd' || e.key === 'D') { toggleTheme(); }
  else if (e.key === 'r' || e.key === 'R') { loadNewSession(); }
  else if (e.key === 'ArrowLeft') {
    if (currentIndex > 0) { currentIndex--; renderQuiz(); }
  }
  else if (e.key === 'ArrowRight') {
    currentIndex++; renderQuiz();
  }
});

// 초기 이벤트 바인딩
document.getElementById('reshuffleBtn').addEventListener('click', loadNewSession);
document.getElementById('themeBtn').addEventListener('click', toggleTheme);

// 시작: 테마 복원 + 오늘 세션 세팅
try {
  const savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme) isDark = (savedTheme === 'dark');
} catch (e) { /* 무시 */ }
applyTheme();
loadNewSession(true);
</script>
</body>
</html>
